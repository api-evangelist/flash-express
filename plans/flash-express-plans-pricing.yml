api_access_model: >-
  Bundled with a Flash Express merchant account at no separate charge. There is no API
  pricing page, no per-call price, no request quota tied to a paid tier, and no metered
  billing documented. A merchant obtains an mchId and security key from Flash Express
  support and integrates at no stated API cost.
