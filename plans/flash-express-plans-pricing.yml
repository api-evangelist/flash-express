note: >-
  Flash Express publishes NO plans, tiers or price list — for the API or for the shipping
  service itself. plan_count is 0, and that is a measured result, not an omission. The
  pricing page at /fle/check-price is an interactive rate calculator: the visitor enters
  origin, destination, weight in kg, package dimensions in cm and product type, and gets a
  quote back. No rate card, weight band table, service tier price, COD fee schedule or VAT
  figure is displayed anywhere on the page, which instead directs the visitor to the sales
  inquiry team. The API itself is not separately priced or metered — it is a free
  integration channel available to Flash Express merchants, and access is gated on having a
  merchant account rather than on purchasing an API plan.
