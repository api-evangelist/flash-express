note: >-
  Flash Express publishes no client library on any public package registry. npm, PyPI,
  RubyGems and a GitHub code search were all checked and returned nothing first-party
  (the only npm hit, "flashexpress-ui", is an unrelated third-party Vue component library
  published by an individual account; every GitHub match is a third-party or unrelated
  project). What Flash Express does distribute first-party is four downloadable reference
  client implementations — C#, PHP, Java and Python — served as ZIP archives directly from
  the developer documentation host under the "Demo Download" section. These are sample
  clients that implement the SHA256 signature scheme and the order-creation call rather
  than versioned, dependency-managed SDKs, so they have no registry metadata endpoint to
  query. Only the C# archive carries a version in its filename; the other three filenames
  are unpinned and float to whatever the docs host currently serves, which means a consumer
  cannot tell which build they are getting either. Each ZIP was fetched and confirmed to be
  a real archive (PK magic bytes, application/zip) on 2026-08-12.
