note: >-
  Flash Express documents NO rate limits for the FlashExpress Open API. limit_count is 0 as
  a measured result. The full published reference was searched for "rate limit", "limit",
  "frequency", "per second", "QPS", "throttl", "quota" and "too many" and none of these
  appear in any operational sense. No response header is described anywhere in the
  documentation — not RateLimit-*, not X-RateLimit-*, not Retry-After — and the published
  response-code registry contains no throttling or too-many-requests code (the 22 documented
  codes cover signature, validation, entitlement, state and coverage failures only). This
  matters for an integrating agent: there is no runtime signal to back off on, so a client
  cannot distinguish being throttled from a generic code 0 internal server error, and must
  implement its own conservative pacing and backoff rather than reacting to a published
  budget. Limits may well be enforced server-side; they are simply not published, and
  nothing was inferred here.
