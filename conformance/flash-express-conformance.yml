source: https://open-docs.flashexpress.com/#api-reference
note: >-
  Cross-cutting standards conformance for the FlashExpress Open API, assessed against the
  published documentation. Flash Express makes no explicit standards or certification claim
  anywhere on its developer surface, and the trust-center/compliance probe found no
  published certification program, so NO `Compliance` pointer is emitted in apis.yml. Every
  `conforms: false` below is a verified absence, not an untested assumption. The overall
  picture is a pre-REST, WeChat-Pay-style signed form-post API: it predates and does not
  adopt most of the modern HTTP API conventions this list tests for.
standards:
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document is published. /openapi.json, /openapi.yaml,
    /swagger.json, /v1/openapi.json and /api-docs were probed on open-api.flashexpress.com
    and open-api-tra.flashexpress.com (all HTTP 404) and on open-docs.flashexpress.com
    (HTTP 200 but the SPA catch-all HTML index, not a spec).
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document published; the event surface is documented webhooks only. See asyncapi/flash-express-webhooks.yml.
- id: graphql
