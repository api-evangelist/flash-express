- id: rest
  conforms: false
  evidence: >-
    Not RESTful. Every operation is HTTP POST including pure reads; HTTP methods carry no
    semantics; business errors return HTTP 200 with an error code in the body rather than
    using HTTP status codes.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a proprietary {code, message, data} envelope with application/json, not
    application/problem+json. See errors/flash-express-error-codes.yml.
- id: oauth2
  conforms: false
  evidence: >-
    No OAuth 2.0. Authentication is shared-secret SHA256 request signing with mchId +
    nonceStr + sign. No authorization server, token endpoint or scopes.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns HTTP 404 on both API hosts.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: false
  evidence: /.well-known/oauth-authorization-server returns HTTP 404 on both API hosts.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
