apis:
- aid: flash-express-open-api
  name: FlashExpress Open API
  description: 'The FlashExpress Open API is the merchant-facing integration surface for Flash
    Express parcel logistics in Thailand. All calls are HTTPS POST with an
    application/x-www-form-urlencoded body and a JSON response envelope of code/message/data.
    Every request is authenticated with a merchant id (mchId), a random nonce string (nonceStr)
    and an uppercase SHA256 signature (sign) computed over the ASCII-sorted non-empty parameters
    joined with a merchant secret key issued by Flash Express support. The API covers warehouse
    listing, the Flash standard address/location tree, sub-account creation, order creation
    (including creation against a merchant-supplied tracking number), order modification and
    cancellation, single and batch parcel route tracking, delivered-proof retrieval, 100x180mm and
    100x75mm label pre-print, freight-rate estimation, courier pickup notification scheduling and
    cancellation, and webhook subscription management.'
