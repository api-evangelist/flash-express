aid: flash-express
name: Flash Express
description: 'Flash Express is a Bangkok-headquartered express parcel delivery and e-commerce
  logistics operator serving Thailand, with affiliated operations in the Philippines and Laos.
  It runs door-to-door pickup and last-mile delivery for B2B, B2C and C2C shippers, including
  next-day and weekend delivery, bulky and fruit shipping, cash-on-delivery collection with daily
  settlement, parcel insurance, and a nationwide network of branches and drop-off points. For
  merchants and platform integrators Flash Express publishes the FlashExpress Open API, an
  HTTPS/POST, form-urlencoded, SHA256-signed interface covering warehouse and sub-account
  management, order creation and modification, label printing, freight-rate estimation, parcel
  tracking, courier pickup scheduling, and a webhook service that pushes status, weight, price,
  courier and route events back to the merchant.'
